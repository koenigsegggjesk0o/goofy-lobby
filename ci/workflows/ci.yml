name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN diminimalkan (remedi audit 25-d): workflow ini hanya membaca
# repo — tanpa blok ini token default bisa lebih luas dari yang diperlukan.
permissions:
  contents: read

# Satu run in-flight per ref — PR yang di-push berulang tidak menumpuk antrean.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SHA penuh, bukan tag (remedi audit 25-d: tag bisa dipindahkan maintainer,
      # SHA tidak). actions/checkout v7.0.1 — SHA diverifikasi via
      # `git ls-remote https://github.com/actions/checkout refs/tags/v7.0.1`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)
        with:
          # Token GitHub tidak di-persist ke config git lokal runner — langkah
          # berikutnya tidak membutuhkannya (tidak ada push/labeler).
          persist-credentials: false

      # Bun dipin ke versi yang dipakai lokal (reproduksibilitas gerbang verify).
      # oven-sh/setup-bun v2.2.0 — SHA diverifikasi via
      # `git ls-remote https://github.com/oven-sh/setup-bun refs/tags/v2.2.0`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (SHA-pinned)
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Empat langkah = empat langkah lokal yang selalu hijau di gerbang
      # `bun run verify` (sisanya: format + e2e — e2e butuh kredensial,
      # sengaja tetap lokal; lihat README seksi "Supabase keepalive" & DoD F1).
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
